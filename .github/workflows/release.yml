name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag matches __version__
        run: grep -q "__version__ = \"${TAG#v}\"" src/arianet/_version.py || { echo "_version.py does not say ${TAG#v}"; exit 1; }
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - run: python -m pip install build==1.2.2.post1 && python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: GitHub release with the sdist and wheel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
          fi

  # Publishes with PyPI trusted publishing (no token stored here). Runs only once the
  # repository variable PYPI_PUBLISH is "true", after the project's trusted publisher
  # (this repository, workflow release.yml, environment pypi) is set up on pypi.org.
  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
