name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Generated code matches specs/
        run: python codegen/generate.py --check
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build and test the wheel
        run: |
          python -m pip install build==1.2.2.post1
          python -m build
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/python -c "import arianet; print(arianet.__version__)"
